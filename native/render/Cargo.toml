[package]
name = "basa-render"
version = "0.1.0"
edition = "2021"
publish = false
description = "BASA import: renders web pages in headless Chromium (CDP) for pages built by JavaScript. Talks to BASA over stdin/stdout, 4-byte length-prefixed JSON."

[dependencies]
chromiumoxide = { version = "=0.9.1", default-features = false }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "io-util", "sync", "time", "net"] }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
url = "2"

[profile.release]
strip = "symbols"
lto = "thin"
