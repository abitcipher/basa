[package]
name = "basa-moderate"
version = "0.1.0"
edition = "2021"
publish = false
description = "BASA photo checks: open image models (nudity, CLIP) on ONNX Runtime, CPU. Talks to BASA over stdin/stdout, 4-byte length-prefixed JSON; downloads the models of the chosen level into its models directory."

[dependencies]
ort = "=2.0.0-rc.15"
ndarray = "0.17"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
tokenizers = { version = "0.23", default-features = false, features = ["fancy-regex"] }
ureq = "3"
sha2 = "0.10"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"

[profile.release]
strip = "symbols"
lto = "thin"
