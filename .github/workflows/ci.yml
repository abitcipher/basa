name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  ELIXIR_VERSION: "1.20.4"
  OTP_VERSION: "29.1"
  TYPST_VERSION: "0.15.1"

jobs:
  test:
    name: Elixir tests
    runs-on: ubuntu-24.04
    env:
      MIX_ENV: test
    steps:
      - uses: actions/checkout@v4
      - name: Start PostgreSQL (PostGIS, pgvector)
        run: docker compose up -d --wait postgres
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Typst
        run: |
          curl -sSfL -o /tmp/typst.tar.xz "https://github.com/typst/typst/releases/download/v${TYPST_VERSION}/typst-x86_64-unknown-linux-musl.tar.xz"
          tar -xJf /tmp/typst.tar.xz -C /tmp
          sudo install -m 0755 /tmp/typst-x86_64-unknown-linux-musl/typst /usr/local/bin/typst
      - uses: actions/cache@v4
        with:
          path: |
            deps
            _build
            ~/.cargo/registry
            ~/.cargo/git
            native/*/target
          key: ${{ runner.os }}-basa-${{ hashFiles('mix.lock', 'native/*/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-basa-
      - run: mix deps.get
      - run: mix format --check-formatted
      - run: mix compile --warnings-as-errors
      - run: mix test

  native:
    name: Rust
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        crate: [witness, render, moderate]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/${{ matrix.crate }}/target
          key: ${{ runner.os }}-${{ matrix.crate }}-${{ hashFiles(format('native/{0}/Cargo.lock', matrix.crate)) }}
      - run: cargo fmt --check --manifest-path native/${{ matrix.crate }}/Cargo.toml
      - run: cargo test --manifest-path native/${{ matrix.crate }}/Cargo.toml

  widgets:
    name: Widgets
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            assets/widgets/package-lock.json
            assets/rules_editor/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: assets/widgets
      - run: npm run check
        working-directory: assets/widgets
      - run: npm run build
        working-directory: assets/widgets
      - run: npm ci --no-audit --no-fund
        working-directory: assets/rules_editor
      - run: npm run build
        working-directory: assets/rules_editor

  image:
    name: Docker image
    runs-on: ubuntu-24.04
    needs: [test, native, widgets]
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
