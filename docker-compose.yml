# BASA services.
#
# Development (infrastructure only; run the app with `mix phx.server`):
#   docker compose up -d
#
# Server (infrastructure + app + Caddy with automatic HTTPS):
#   docker compose --profile prod up -d --build
#
# Settings come from `.env` (copy `.env.example`).

name: basa

x-restart: &restart
  restart: unless-stopped

services:
  # The import's page renderer (Basa.Import.Browser starts it with
  # `docker run -i`, one container per BASA run); only built here:
  #   docker compose build render
  render:
    profiles: ["build"]
    build:
      context: ./native/render
      dockerfile: ../../docker/render/Dockerfile
    image: basa/render:0.1
    pull_policy: build

  # Photo checks (Basa.Moderation starts it with `docker run -i` and the
  # basa_models volume); only built here:
  #   docker compose build moderate
  moderate:
    profiles: ["build"]
    build:
      context: ./native/moderate
      dockerfile: ../../docker/moderate/Dockerfile
    image: basa/moderate:0.1
    pull_policy: build

  postgres:
    <<: *restart
    build: ./docker/postgres
    image: basa/postgres:18-3.6-pgvector
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-basa_dev}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10

  rustfs:
    <<: *restart
    image: rustfs/rustfs:1.0.4
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:-basa}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:-basa-secret}
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
    ports:
      - "127.0.0.1:${S3_PORT:-9000}:9000"
      - "127.0.0.1:${S3_CONSOLE_PORT:-9001}:9001"
    volumes:
      - rustfs_data:/data

  rabbitmq:
    <<: *restart
    image: rabbitmq:4.4.0-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-basa}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-basa}
    ports:
      - "127.0.0.1:${RABBITMQ_PORT:-5672}:5672"
      - "127.0.0.1:${RABBITMQ_UI_PORT:-15672}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  meilisearch:
    <<: *restart
    image: getmeili/meilisearch:v1.56.0
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-basa-dev-master-key-change-me}
      MEILI_ENV: ${MEILI_ENV:-development}
      MEILI_NO_ANALYTICS: "true"
    ports:
      - "127.0.0.1:${MEILI_PORT:-7700}:7700"
    volumes:
      - meili_data:/meili_data

  stalwart:
    <<: *restart
    image: stalwartlabs/stalwart:v1.0.1
    ports:
      - "${SMTP_PORT:-2525}:25"
      - "${SUBMISSION_PORT:-5870}:587"
      - "127.0.0.1:${STALWART_ADMIN_PORT:-8090}:8080"
    volumes:
      - stalwart_data:/opt/stalwart

  # EU Digital Signature Service: whether a signature is qualified (eIDAS
  # trusted lists). Loads the EU lists on start and every hour.
  dss:
    <<: *restart
    build: ./docker/dss
    image: basa/dss:6.5.1
    ports:
      - "127.0.0.1:${DSS_PORT:-8095}:8080"
    volumes:
      # extra trust anchors; never make a signature qualified (development:
      # the CSC emulator's test CA; on the server set an empty directory)
      - ${DSS_TRUST_DIR:-./docker/dss/dev-trust}:/trust:ro

  # ---- server profile -------------------------------------------------------

  app:
    <<: *restart
    profiles: ["prod"]
    build: .
    image: basa/app:latest
    env_file: .env
    # Migrate and seed categories, then start (both steps are idempotent)
    command: ["sh", "-c", "/app/bin/migrate && /app/bin/basa eval 'Basa.Release.seed()' && /app/bin/server"]
    environment:
      PHX_SERVER: "true"
      DATABASE_URL: ecto://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres/${POSTGRES_DB:-basa_prod}
      S3_ENDPOINT: http://rustfs:9000
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-basa}:${RABBITMQ_PASSWORD:-basa}@rabbitmq:5672
      MEILI_URL: http://meilisearch:7700
      SMTP_RELAY: stalwart
      DSS_URL: http://dss:8080
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      rustfs: { condition: service_started }
      meilisearch: { condition: service_started }
      dss: { condition: service_started }

  caddy:
    <<: *restart
    profiles: ["prod"]
    image: caddy:2.11.7
    environment:
      BASA_HOST: ${BASA_HOST:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [app]

volumes:
  postgres_data:
  rustfs_data:
  rabbitmq_data:
  meili_data:
  stalwart_data:
  caddy_data:
  caddy_config:
